name: Build and smoke-test COMPUCARE Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check hosted website availability
        run: curl --fail --silent --show-error --location --max-time 30 --output /dev/null --write-out "COMPUCARE website HTTP %{http_code}\n" https://compucare-service-sf3up4.v2.appdeploy.ai/

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK package and signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.zkelite.compucareservice'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.zkelite.compucareservice/.MainActivity
            sleep 25
            adb shell pidof com.zkelite.compucareservice
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | grep "com.zkelite.compucareservice"
            adb shell screencap -p /sdcard/compucare-home.png
            adb pull /sdcard/compucare-home.png app/build/outputs/apk/debug/compucare-emulator-home.png

      - name: Upload APK and smoke-test evidence
        uses: actions/upload-artifact@v4
        with:
          name: compucare-service-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/compucare-emulator-home.png
          if-no-files-found: error
          retention-days: 7
