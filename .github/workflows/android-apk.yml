name: Build and smoke-test COMPUCARE Android app

on:
  push:
    branches: [main, native-offline-android]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Check hosted website availability
        run: curl --fail --silent --show-error --location --max-time 30 --output /dev/null --write-out "COMPUCARE website HTTP %{http_code}\\n" https://compucare-service-sf3up4.v2.appdeploy.ai/

      - name: Build debug APK and release bundle
        run: gradle --no-daemon clean assembleDebug bundleRelease

      - name: Verify debug APK package and signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.zkelite.compucareservice'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/app-debug.apk.sha256
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Upload test APK and unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: compucare-service-android-builds
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -Eeuo pipefail
            mkdir -p app/build/outputs/apk/debug/emulator-diagnostics
            DIAG="app/build/outputs/apk/debug/emulator-diagnostics"
            on_failure() {
              status=$?
              adb logcat -d -v threadtime > "$DIAG/logcat.txt" 2>&1 || true
              adb shell dumpsys activity activities > "$DIAG/activities.txt" 2>&1 || true
              adb shell dumpsys package com.zkelite.compucareservice > "$DIAG/package.txt" 2>&1 || true
              adb shell pm list packages -3 > "$DIAG/installed-packages.txt" 2>&1 || true
              echo "Emulator smoke test failed with exit code $status"
              exit "$status"
            }
            trap on_failure ERR
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.zkelite.compucareservice
            adb shell am start -W -n com.zkelite.compucareservice/.MainActivity
            sleep 25
            adb shell pidof com.zkelite.compucareservice
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | grep "com.zkelite.compucareservice"
            adb exec-out screencap -p > app/build/outputs/apk/debug/compucare-emulator-home.png
            test -s app/build/outputs/apk/debug/compucare-emulator-home.png

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compucare-emulator-diagnostics
          path: app/build/outputs/apk/debug/emulator-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
